name: Build Debian Package (with mk-build-deps)

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write   # без этого релиз не создастся

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base tools for mk-build-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts equivs

      - name: Generate and install build-deps from debian/control
        run: |
          mk-build-deps --install --remove --root-cmd sudo --build-dep --tool 'apt-get -o Debug::pkgProblemResolver=yes'

      - name: Build deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Read version from debian/changelog
        id: changelog
        run: |
          echo "source=$(dpkg-parsechangelog -S Source)"   >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

      # ВАЖНО: копируем артефакты в текущую директорию, чтобы action-gh-release их увидел
      - name: Move artifacts to root
        working-directory: ${{ github.workspace }}
        run: |
          # Копируем .deb, .changes, .buildinfo из родительской папки в текущую
          cp ../*.deb ../*.changes ../*.buildinfo . || true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: ${{ steps.changelog.outputs.source }} ${{ steps.changelog.outputs.version }}
          body: "Debian package ${{ steps.changelog.outputs.source }} ${{ steps.changelog.outputs.version }}"
          files: |
            *.deb
            *.changes
            *.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
