name: Build Debian Package (with mk-build-deps)

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write   # без этого релиз не создастся

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base tools for mk-build-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts equivs

      - name: Generate and install build-deps from debian/control
        run: |
          mk-build-deps --install --remove --root-cmd sudo --build-dep --tool 'apt-get -o Debug::pkgProblemResolver=yes'

      - name: Build deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Read version from debian/changelog
        id: changelog
        run: |
          echo "source=$(dpkg-parsechangelog -S Source)"   >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

      - name: Move artifacts to root
        working-directory: ${{ github.workspace }}
        run: |
          cp ../*.deb ../*.changes ../*.buildinfo . || true

      - name: Extract package metadata
        id: pkg
        run: |
          pkg_version=$(dpkg-parsechangelog -S Version)
          deb_file="startxpy_${pkg_version}_all.deb"
          echo "pkg_version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "deb_file=${deb_file}" >> "$GITHUB_OUTPUT"

      - name: Prepare release body
        run: |
          # Забираем переменные из предыдущего шага
          pkg_version="${{ steps.pkg.outputs.pkg_version }}"
          deb_file="${{ steps.pkg.outputs.deb_file }}"

          # Переменные Actions тоже забираем в bash-переменные
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          cat > /tmp/release_body.md <<EOF
          # Debian-пакет startxpy v${pkg_version}

          Готовый \`.deb\` для Debian/Ubuntu.

          ## Установка

          \`\`\`bash
          wget https://github.com/${repo}/releases/download/${tag}/${deb_file}
          sudo dpkg -i ${deb_file}
          sudo apt-get install -f
          \`\`\`

          ## Что нового (changelog)

          $(dpkg-parsechangelog -S Changes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.pkg.outputs.deb_file }}
            *.changes
            *.buildinfo
